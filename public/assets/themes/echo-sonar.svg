<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="sea"><stop stop-color="#052e2b"/><stop offset=".55" stop-color="#04201f"/><stop offset="1" stop-color="#010b0a"/></radialGradient>
    <filter id="ping"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="arc"><path d="M500 500 L500 60 A440 440 0 0 1 918 638 Z"/></clipPath>
  </defs>
  <rect width="1000" height="1000" fill="url(#sea)"/>
  <g fill="none" stroke="#2dd4bf" stroke-opacity=".42">
    <circle cx="500" cy="500" r="120" stroke-width="5"><animate attributeName="r" values="80;470" dur="3.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;.05" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="500" r="240" stroke-width="3"/><circle cx="500" cy="500" r="360" stroke-width="2"/>
  </g>
  <g clip-path="url(#arc)" filter="url(#ping)">
    <path d="M500 500 L500 34 A466 466 0 0 1 944 644 Z" fill="#5eead4" opacity=".16"/>
    <g fill="#a7f3d0">
      <circle cx="676" cy="232" r="8"><animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="812" cy="448" r="6"><animate attributeName="opacity" values="0;0;1;0" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="604" cy="688" r="7"><animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="-.9s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="604" r="5"><animate attributeName="opacity" values="0;0;1;0" dur="3.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="4.8s" repeatCount="indefinite"/>
  </g>
  <circle cx="500" cy="500" r="16" fill="#a7f3d0" filter="url(#ping)"/>
</svg>
