<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#020b08"/>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:28px;fill:#10b981}
    .blue{fill:#38bdf8}.lime{fill:#a3e635}
  </style>
  <g>
    <text x="70" y="92">root@rc: sync --profile<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.76;1" dur="3.2s" begin="0s" repeatCount="indefinite"/></text>
    <text x="70" y="132" class="blue">match.fetch(rounds=true)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.14;.28;.78;1" dur="3.6s" begin="-.4s" repeatCount="indefinite"/></text>
    <text x="70" y="172">0101 1100 0011 1010<animate attributeName="opacity" values="0;1;0;1;0" dur="2.6s" begin="-1.1s" repeatCount="indefinite"/></text>
    <text x="430" y="106" class="lime">PATCH /focus_model<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.16;.72;1" dur="3.8s" begin="-2.1s" repeatCount="indefinite"/></text>
    <text x="430" y="150">rr_delta = verified<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.34;.82;1" dur="3.1s" begin="-.9s" repeatCount="indefinite"/></text>
    <text x="430" y="194" class="blue">coach.rules.apply()<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.68;1" dur="2.9s" begin="-1.7s" repeatCount="indefinite"/></text>
    <text x="820" y="92">SELECT * FROM loadout<animate attributeName="opacity" values="0;1;0;1;0" dur="3.4s" begin="-2.5s" repeatCount="indefinite"/></text>
    <text x="820" y="136" class="lime">rank.window.clean()<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.38;.76;1" dur="4s" begin="-.7s" repeatCount="indefinite"/></text>
    <text x="820" y="180">stream: 11 00 10 01<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.8;1" dur="2.7s" begin="-1.3s" repeatCount="indefinite"/></text>
    <text x="130" y="392" class="blue">impact_score += clutch<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.84;1" dur="3.7s" begin="-3s" repeatCount="indefinite"/></text>
    <text x="130" y="436">timeline.write(day)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.16;.32;.8;1" dur="3s" begin="-.2s" repeatCount="indefinite"/></text>
    <text x="540" y="386" class="lime">map.fit.recompute()<animate attributeName="opacity" values="0;1;0;1;0" dur="3.5s" begin="-2.2s" repeatCount="indefinite"/></text>
    <text x="540" y="430">agent_lens: duelist<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.74;1" dur="2.8s" begin="-1s" repeatCount="indefinite"/></text>
    <text x="780" y="590" class="blue">if confidence &gt; .72<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.24;.4;.86;1" dur="4.1s" begin="-1.9s" repeatCount="indefinite"/></text>
    <text x="780" y="634">render.insight()<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.8;1" dur="3.3s" begin="-2.8s" repeatCount="indefinite"/></text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 18;0 0" dur="4s" repeatCount="indefinite"/>
    <path d="M0 620 H1200" stroke="#38bdf8" stroke-width="18" opacity=".12"/>
    <path d="M0 674 H1200" stroke="#10b981" stroke-width="8" opacity=".16" stroke-dasharray="80 120"><animate attributeName="stroke-dashoffset" values="0;-300" dur="3s" repeatCount="indefinite"/></path>
  </g>
</svg>
