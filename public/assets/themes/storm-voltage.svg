      <stop stop-color="#172554"/>
      <stop offset=".48" stop-color="#06142c"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="cloudGlow" cx=".5" cy=".12" r=".82">
