      .branch{stroke:#93c5fd;stroke-width:4.5}
      .ghost{stroke:#60a5fa;stroke-width:12;opacity:0;stroke-dasharray:980;stroke-dashoffset:980;filter:url(#boltGlow)}
    </style>
  </defs>
