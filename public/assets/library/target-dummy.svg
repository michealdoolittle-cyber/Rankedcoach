<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" role="img" aria-labelledby="title desc">
  <title id="title">Generic target dummy</title>
  <desc id="desc">A simple front-facing target dummy with a dark red head, pink torso, gray arms, and pale pink lower legs.</desc>
  <defs>
    <filter id="soft-glow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)">
    <circle cx="32" cy="10" r="6" fill="#b91c35" stroke="#ff8fa3" stroke-width="1.6"/>
    <path d="M22 22c0-4 3-7 10-7s10 3 10 7v28H22Z" fill="#ff708a" stroke="#ffd3dc" stroke-width="1.8"/>
    <path d="M22 26 14 45M42 26l8 19" stroke="#cbd5e1" stroke-width="4.2"/>
    <path d="M14 45v10M50 45v10" stroke="#e5e7eb" stroke-width="3.2"/>
    <path d="M26 51v32M38 51v32" stroke="#ffe6ee" stroke-width="5.4"/>
    <path d="M26 83h-5M38 83h5" stroke="#ffe6ee" stroke-width="4.2"/>
  </g>
</svg>
